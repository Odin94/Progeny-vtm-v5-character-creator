name: Deploy backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
  workflow_dispatch:

# Keep deployments ordered: the update script runs migrations and restarts the
# process, so two deploys must never operate on the server concurrently.
concurrency:
  group: backend-production-deploy
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    name: Update Hetzner backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HETZNER_HOST: 46.224.62.32
      HETZNER_USER: progeny

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HETZNER_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"

      - name: Update backend on Hetzner
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$HETZNER_USER@$HETZNER_HOST" \
            "bash /opt/progeny/backend/scripts/updateCode.sh '$DEPLOY_SHA'"

  notify-on-failure:
    name: Notify deployment failure
    needs: deploy
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Send failure email
        env:
          SMTP_HOST: ${{ secrets.DEPLOY_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.DEPLOY_SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.DEPLOY_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.DEPLOY_SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.DEPLOY_SMTP_FROM }}
          DEPLOY_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          required = (
              "SMTP_HOST",
              "SMTP_PORT",
              "SMTP_USERNAME",
              "SMTP_PASSWORD",
              "SMTP_FROM",
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(f"Missing required SMTP configuration: {', '.join(missing)}")

          message = EmailMessage()
          message["From"] = os.environ["SMTP_FROM"]
          message["To"] = "kammerloher.andreas@gmail.com"
          message["Subject"] = f"Backend deployment failed: {os.environ['REPOSITORY']}"
          message.set_content(
              "The Progeny backend deployment failed.\n\n"
              f"Commit: {os.environ['DEPLOY_SHA']}\n"
              f"Workflow run: {os.environ['RUN_URL']}\n"
          )

          context = ssl.create_default_context()
          with smtplib.SMTP_SSL(
              os.environ["SMTP_HOST"], int(os.environ["SMTP_PORT"]), context=context
          ) as smtp:
              smtp.login(os.environ["SMTP_USERNAME"], os.environ["SMTP_PASSWORD"])
              smtp.send_message(message)
          PY
